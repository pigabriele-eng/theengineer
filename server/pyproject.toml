[project]
name = "theengineer-server"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "python-multipart>=0.0.9",
  "numpy>=1.26",
  "anthropic>=1.11",
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "pypdf>=4.0",  # official results sheets (PDF)  # Postgres (Supabase) when DATABASE_URL points at one
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff~=0.16.10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "RUF"]
ignore = [
  "E741",  # `l` for a lap reads naturally here
  "B008",  # FastAPI dependencies are declared as `Depends(...)` defaults
]
