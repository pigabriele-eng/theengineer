name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request cancels the checks still running for its previous push. Runs on main each get a
# group of their own, so none is ever cancelled or kept waiting.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # The server tests in four parallel jobs, each a quarter of the test files by time (see tests/conftest.py), each
  # with a worker per CPU (pytest-xdist). Their checks are "server (1/4)" to "server (4/4)".
  server:
    name: server (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.11"
      # the installed packages are kept between runs; installed again only when pyproject.toml or Python changes
      - uses: actions/cache@v4
        id: venv
        with:
          path: server/.venv
          key: venv-${{ runner.os }}-${{ runner.arch }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('server/pyproject.toml') }}
      - if: steps.venv.outputs.cache-hit != 'true'
        run: python -m venv .venv && .venv/bin/pip install -e ".[dev]"
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - if: matrix.shard == 1
        run: ruff check .
      - run: pytest -q -n auto --shard ${{ matrix.shard }}/${{ strategy.job-total }} --store-durations && cat tests/durations.json

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        id: node
        with:
          node-version: 22
      # node_modules is kept between runs; npm ci runs again only when package-lock.json or Node changes
      - uses: actions/cache@v4
        id: modules
        with:
          path: app/node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('app/package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci
      - name: typecheck, unit tests and web build (the typecheck runs beside the build)
        run: |
          npm run typecheck > "$RUNNER_TEMP/typecheck.log" 2>&1 &
          typecheck=$!
          npm test
          npx expo export --platform web --output-dir dist
          node scripts/web-preload.mjs dist
          status=0
          wait $typecheck || status=$?
          echo "typecheck:"
          cat "$RUNNER_TEMP/typecheck.log"
          exit $status
